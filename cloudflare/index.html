<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Munnesir</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap">
</head>
<body class="theme-purple">

  <!-- EN ÜST SABİT BANNER -->
  <header class="topBanner">
    <div class="bannerLeft">
      <button id="sidebarToggle" class="iconBtn" type="button" aria-label="Menü">☰</button>
      <div class="brandTop">
        <img src="icons/m-cir.png" alt="Munnesir Logo" class="brandLogo">
        <h1 class="brandTitle">Munnesir</h1>
      </div>
    </div>
    <div class="bannerRight">
      <button id="settingsOpenBtn" class="iconBtn" type="button" title="Ayarlar">⚙</button>
    </div>
  </header>

  <div class="appContainer" id="appContainer">
    <!-- SOL SLIDE MENÜ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebarNav">
        <!-- ARAMA KUTUSU -->
        <div class="navSection">
          <input type="text" id="searchInput" class="textInput" placeholder="🔍 Şiir veya etiket ara..." />
        </div>

        <!-- ETİKETLER KUTUSU -->
        <div class="navSection">
          <span class="sectionTitle">Etiketler</span>
          <div id="tagCloud" class="tagCloud"></div>
        </div>

        <!-- DURUM FİLTRELERİ -->
        <div class="navSection">
          <span class="sectionTitle">Durum</span>
          <div id="statusFilters" class="statusFilters">
            <button class="stdBtn active" data-status="all" type="button">Tümü</button>
            <button class="stdBtn" data-status="draft" type="button">Taslak</button>
            <button class="stdBtn" data-status="ready" type="button">Yayına hazır</button>
            <button class="stdBtn" data-status="archive" type="button">Arşiv</button>
            <button class="stdBtn" data-status="favorite" type="button">★ Seçmeler</button>
          </div>
        </div>

        <div class="navSection">
          <button id="bookViewBtn" class="stdBtn full" type="button">📚 Kitap adayları</button>
          <button id="trashViewBtn" class="stdBtn full" type="button">🗑 Çöp kutusu</button>
        </div>
      </div>
    </aside>

    <!-- ANA İÇERİK (SAYFA İTİLME ALANI) -->
    <main class="mainContent" id="mainContent">
      <div class="contentHeader">
        <span id="statsLine">0 şiir</span>
      </div>

      <section id="poemGrid" class="poemGrid"></section>
      <div id="emptyState" class="emptyState" hidden>
        <h2>Arşiv boş.</h2>
        <p>Sağ alttaki + butonunu kullanarak ilk şiirini ekleyebilirsin.</p>
      </div>
    </main>
  </div>

  <!-- GOOGLE KEEP USULÜ FLOATING (+) BUTONU -->
  <button id="newPoemFabBtn" class="fabBtn" type="button" title="Yeni Şiir Ekle">+</button>

  <!-- AYARLAR & REVİZE SENKRONİZASYON POP-UP -->
  <dialog id="settingsDialog" class="modalDialog">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2>Ayarlar</h2>
        <button id="closeSettingsBtn" class="iconBtn" type="button">✕</button>
      </div>
      <div class="modalBody">
        <!-- TEMA SEÇİMİ -->
        <div class="settingGroup">
          <h3>Tema Seçimi</h3>
          <div class="themeChoices">
            <button class="stdBtn themeChoice" data-theme-choice="purple" type="button">Mor</button>
            <button class="stdBtn themeChoice" data-theme-choice="light" type="button">Aydınlık</button>
            <button class="stdBtn themeChoice" data-theme-choice="black" type="button">Siyah</button>
          </div>
        </div>

        <!-- ELDEN GEÇİRİLMİŞ SENKRONİZASYON BLOĞU -->
        <div class="settingGroup">
          <h3>Bulut Senkronizasyonu</h3>
          <div class="syncBlock">
            <input type="password" id="syncPasswordInput" placeholder="Munnesir Şifresi" class="textInput" />
            <div class="syncActions">
              <button id="syncSignInBtn" class="stdBtn primary" type="button">Giriş Yap</button>
              <button id="syncNowBtn" class="stdBtn" type="button">Şimdi Senkronize Et</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <!-- KİTAP ADAYLARI POP-UP -->
  <dialog id="bookDialog" class="modalDialog">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2>📚 Kitap Adayları</h2>
        <button id="closeBookBtn" class="iconBtn" type="button">✕</button>
      </div>
      <div class="modalBody" id="bookListContainer">
        <p>Henüz kitap adayı eklenmemiş.</p>
      </div>
    </div>
  </dialog>

  <!-- ÇÖP KUTUSU POP-UP -->
  <dialog id="trashDialog" class="modalDialog">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2>🗑 Çöp Kutusu</h2>
        <button id="closeTrashBtn" class="iconBtn" type="button">✕</button>
      </div>
      <div class="modalBody" id="trashListContainer">
        <p>Çöp kutusu boş.</p>
      </div>
    </div>
  </dialog>

  <!-- ŞİİR YAZMA EDİTÖRÜ -->
  <dialog id="poemDialog" class="modalDialog">
    <form method="dialog" id="poemForm" class="modalContainer">
      <div class="modalHeader">
        <input id="poemTitleInput" class="poemTitleInput" type="text" placeholder="Şiir başlığı..." required />
        <button id="closePoemBtn" class="iconBtn" type="button">✕</button>
      </div>

      <textarea id="poemContentInput" class="poemContentTextarea font-times" placeholder="Mısralarınızı buraya yazın... (#etiket ekleyebilirsiniz)" required></textarea>

      <div class="modalFooter">
        <button id="savePoemBtn" class="stdBtn primary" type="submit">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- ŞİİR OKUMA PENCERESİ -->
  <dialog id="readerDialog" class="modalDialog">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2 id="readerTitle"></h2>
        <button id="closeReaderBtn" class="iconBtn" type="button">✕</button>
      </div>
      <div id="readerMeta" class="cardMeta"></div>
      <pre id="readerContent" class="readerContent font-times"></pre>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
