<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Munnesir v1.0</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap">
</head>
<body>

  <!-- ORİJİNAL SOL MENÜ -->
  <aside class="sidebar" id="sidebar">
    <div class="brandHeader">
      <div class="brandTop">
        <img src="icons/m-cir.png" alt="Munnesir Logo" class="brandLogo">
        <h1 class="brandTitle">Munnesir</h1>
      </div>
      <p class="brandSubtitle">hayata yeni yelkenler açmaya çalışan bir oluşum</p>
    </div>

    <div class="sidebarNav">
      <div class="navSection">
        <input type="text" id="searchInput" class="searchInput" placeholder="🔍 Şiir veya etiket ara..." />
      </div>

      <div class="navSection">
        <span class="sectionTitle">Etiketler</span>
        <div id="tagCloud" class="tagCloud"></div>
      </div>

      <div class="navSection">
        <span class="sectionTitle">Durum</span>
        <div id="statusFilters" class="statusFilters">
          <button class="navBtn active" data-status="all" type="button">Tümü</button>
          <button class="navBtn" data-status="draft" type="button">Taslak</button>
          <button class="navBtn" data-status="ready" type="button">Yayına hazır</button>
          <button class="navBtn" data-status="archive" type="button">Arşiv</button>
          <button class="navBtn" data-status="favorite" type="button">★ Seçmeler</button>
        </div>
      </div>

      <div class="navSection">
        <button id="bookViewBtn" class="navBtn full" type="button">📚 Kitap adayları</button>
        <div class="activeBooksContainer" id="activeBooksContainer"></div>
      </div>

      <div class="navSection">
        <button id="trashViewBtn" class="navBtn full" type="button">🗑 Çöp kutusu</button>
      </div>
    </div>
  </aside>

  <!-- ANA İÇERİK ALANI -->
  <div class="appLayout">
    <header class="topBanner">
      <div class="bannerLeft">
        <button id="sidebarToggle" class="iconBtn mobileOnly" type="button">☰</button>
      </div>

      <button id="newPoemBtn" class="primaryBtn" type="button">+ Yeni Şiir</button>

      <div class="bannerRight">
        <button id="settingsOpenBtn" class="iconBtn" type="button" title="Ayarlar">⚙</button>
      </div>
    </header>

    <main class="mainContent">
      <div class="contentHeader">
        <span id="statsLine">0 şiir</span>
      </div>

      <section id="poemGrid" class="poemGrid"></section>
      <div id="emptyState" class="emptyState" hidden>
        <h2>Arşiv boş.</h2>
        <p>Henüz kayıtlı bir şiir bulunmuyor.</p>
      </div>
    </main>
  </div>

  <!-- AYARLAR POP-UP -->
  <dialog id="settingsDialog" class="modalDialog">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2>Ayarlar</h2>
        <button id="closeSettingsBtn" class="iconBtn" type="button">✕</button>
      </div>

      <div class="settingsTabsList">
        <button class="settingTabBtn active" data-tab="tab-theme" type="button">Tema</button>
        <button class="settingTabBtn" data-tab="tab-font" type="button">Font</button>
      </div>

      <div class="settingsTabContent">
        <div class="tabSubPage active" id="tab-theme">
          <h3>Tema Seçimi</h3>
          <div class="themeChoices">
            <button class="themeChoice" data-theme-choice="purple" type="button">Mor</button>
            <button class="themeChoice" data-theme-choice="light" type="button">Aydınlık</button>
            <button class="themeChoice" data-theme-choice="black" type="button">Siyah</button>
          </div>
        </div>

        <div class="tabSubPage" id="tab-font">
          <h3>Şiir Yazı Fontu</h3>
          <select id="globalFontSelect" class="selectInput">
            <option value="font-times">Times New Roman</option>
            <option value="font-roboto">Roboto</option>
            <option value="font-google-sans">Google Sans</option>
          </select>
        </div>
      </div>
    </div>
  </dialog>

  <!-- ŞİİR YAZMA EDITÖRÜ -->
  <dialog id="poemDialog" class="modalDialog">
    <form method="dialog" id="poemForm" class="modalContainer">
      <div class="modalHeader">
        <input id="poemTitleInput" class="poemTitleInput" type="text" placeholder="Şiir başlığı..." />
        <button id="closePoemBtn" class="iconBtn" type="button">✕</button>
      </div>

      <textarea id="poemContentInput" class="poemContentTextarea font-times" placeholder="Mısralarınızı buraya yazın..."></textarea>

      <div class="modalFooter">
        <select id="editorFontSelect" class="selectInput fontSelectSm">
          <option value="font-times">Times New Roman</option>
          <option value="font-roboto">Roboto</option>
          <option value="font-google-sans">Google Sans</option>
        </select>
        <button id="savePoemBtn" class="primaryBtn" type="submit">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- ŞİİR OKUMA PENCERESİ -->
  <dialog id="readerDialog" class="modalDialog readerModal">
    <div class="modalContainer">
      <div class="modalHeader">
        <h2 id="readerTitle"></h2>
        <button id="closeReaderBtn" class="iconBtn" type="button">✕</button>
      </div>
      <div id="readerMeta" class="cardMeta"></div>
      <pre id="readerContent" class="readerContent font-times"></pre>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
